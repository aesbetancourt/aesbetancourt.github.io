<!doctype html>

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Reveal flag: only hide animated content when JS will animate it and
         motion is allowed. No-JS / reduce-motion users see content immediately. -->
    <script>
      (function () {
        try {
          var mq = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)")
          if (!mq || !mq.matches) document.documentElement.setAttribute("data-anim", "on")
        } catch (e) {}
      })()
    </script>

    <!-- Primary meta -->
    <title>Alejandro Sánchez | Senior Fullstack AI Engineer</title>
    <meta
      name="description"
      content="Alejandro Sánchez, Senior Fullstack AI Engineer building scalable distributed systems with TypeScript, Node.js, Python & AI. LLM orchestration, RAG and production-grade backends. Europe, remote."
    />
    <meta name="author" content="Alejandro Sánchez" />

      content="Alejandro Sánchez, aesbetancourt, Fullstack AI Engineer, TypeScript, Python, Node.js, React, Next.js, distributed systems, LLM, RAG, AWS, GCP, software engineer"
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#0d0e11" />

    <!-- Theme: apply the saved choice, else the system preference, before paint
         so there's no light/dark flash. Defaults to dark when unknown. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme")
          var sysLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
          var theme = stored === "light" || stored === "dark" ? stored : sysLight ? "light" : "dark"
          var root = document.documentElement
          root.classList.remove("light", "dark")
          root.classList.add(theme)
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute("content", theme === "light" ? "#f5f3ee" : "#0d0e11")
        } catch (e) {}
      })()
    </script>
