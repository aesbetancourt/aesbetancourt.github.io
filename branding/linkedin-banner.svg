<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#2a2c33"/>
    </pattern>
    <!-- fade the grid out toward the text on the right -->
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d0e11" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#0d0e11" stop-opacity="0.2"/>
      <stop offset="0.7" stop-color="#0d0e11" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect width="1584" height="396" fill="#0d0e11"/>
  <rect width="1584" height="396" fill="url(#dots)"/>
  <rect width="1584" height="396" fill="url(#fade)"/>

  <!-- service graph motif, kept above the profile photo area -->
  <g stroke="#e2645a" stroke-width="1.5" fill="none" opacity="0.55">
    <path d="M122 98 H290 V170 H458"/>
    <path d="M290 98 V50 H458"/>
    <path d="M458 170 H560 V242"/>
  </g>
  <g fill="#0d0e11" stroke="#e2645a" stroke-width="1.5">
    <rect x="106" y="86" width="32" height="24" rx="5"/>
    <rect x="442" y="38" width="32" height="24" rx="5" opacity="0.7"/>
    <rect x="442" y="158" width="32" height="24" rx="5"/>
    <rect x="544" y="230" width="32" height="24" rx="5" opacity="0.7"/>
  </g>
  <circle cx="290" cy="98" r="4" fill="#e2645a"/>

  <!-- content, right-aligned -->
  <g text-anchor="end">
    <text x="1504" y="118" font-family="'Space Mono', ui-monospace, monospace" font-size="19" fill="#a7a59d">Computer Engineer. Building scalable systems daily.</text>
    <text x="1504" y="192" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="600" font-size="46" letter-spacing="-0.5" fill="#ece9e2">Designing scalable distributed systems</text>
    <text x="1504" y="250" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="600" font-size="46" letter-spacing="-0.5" fill="#ece9e2">for <tspan fill="#e2645a">AI</tspan>-powered products.</text>
    <text x="1504" y="318" font-family="'Space Mono', ui-monospace, monospace" font-size="18" letter-spacing="1" fill="#6f6e69">system architecture · distributed systems · AI · aesbetancourt.dev</text>
  </g>
</svg>
